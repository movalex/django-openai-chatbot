[project]
name = "django-openai-chatbot"
version = "0.2.1"
description = "Django web application providing a chatbot interface powered by OpenAI GPT models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "django==4.2.2",
    "django-environ>=0.13.0",
    "gunicorn>=23.0.0",
    "markdown>=3.9",
    "openai>=2.8.0",
    "pymdown-extensions>=10.17.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "factory-boy>=3.3.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "django-stubs[compatible-mypy]>=4.2.7",
    "pre-commit>=3.6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_chatbot.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=chatbot",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["chatbot/tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take longer to run",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations", "staticfiles"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sorting, UP pyupgrade, B bugbear,
# DJ flake8-django. Line-length violations (E501) are reported by the
# formatter, not the linter, to avoid churn on long legacy lines.
select = ["E", "W", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.mypy]
# Incremental adoption: django-stubs gives ORM/HttpRequest typing, but the
# existing code is largely untyped, so this is intentionally lenient for now.
# Strictness ratchets up as type hints are added in later phases.
# Analysis target matches the project's runtime Python.
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ['migrations/', 'tests/']

[tool.django-stubs]
django_settings_module = "django_chatbot.settings"
